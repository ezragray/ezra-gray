<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1b19;
    --text:#ece7de;
    --muted:#9b9387;
    --accent:#c97c3c;
    --line:#3a362f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
  .stage{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0;
  }

  /* ── viewport window ── */
  .window{
    position:relative;
    width:min(88vw, 800px);
    aspect-ratio:4/3;
    overflow:hidden;
    border:1px solid var(--line);
  }

  /* ── the sliding strip ── */
  .strip{
    display:flex;
    height:100%;
    transition:transform 0.42s cubic-bezier(0.25,0.46,0.45,0.94);
    will-change:transform;
  }
  .slide{
    flex:0 0 100%;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .slide img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    display:block;
  }

  /* ── arrows ── */
  .arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    background:rgba(28,27,25,0.55);
    border:1px solid rgba(255,255,255,0.1);
    color:var(--text);
    width:40px;height:40px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:18px;
    user-select:none;
    z-index:2;
    transition:background 0.15s,border-color 0.15s;
  }
  .arrow:hover{background:rgba(201,124,60,0.5);border-color:var(--accent);}
  .arrow.prev{left:12px;}
  .arrow.next{right:12px;}
  .arrow.hidden{opacity:0;pointer-events:none;}

  /* ── caption bar ── */
  .caption-bar{
    width:min(88vw, 800px);
    display:flex;
    align-items:baseline;
    gap:16px;
    margin-top:14px;
    padding:0 2px;
  }
  .counter{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--accent);
    flex:0 0 auto;
    white-space:nowrap;
  }
  .desc{
    font-family:'Fraunces',serif;
    font-size:17px;
    color:var(--text);
    line-height:1.4;
  }

  /* ── dots ── */
  .dots{display:flex;gap:8px;margin-top:14px;}
  .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--line);
    cursor:pointer;
    transition:background 0.2s,transform 0.2s;
  }
  .dot.active{background:var(--accent);transform:scale(1.4);}

  .msg{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:20px;}
</style>
</head>
<body>
<div class="stage">
  <div class="window" id="window">
    <div class="strip" id="strip"></div>
    <div class="arrow prev" id="prev">&#8249;</div>
    <div class="arrow next" id="next">&#8250;</div>
  </div>
  <div class="caption-bar" id="captionBar"></div>
  <div class="dots" id="dots"></div>
</div>

<script>
// ---- CONFIG: edit these to match your repo ----
const OWNER = "YOUR-GITHUB-USERNAME";
const REPO  = "YOUR-REPO-NAME";
const BRANCH = "main";
const IMAGES_PATH = "images";
const MANIFEST_PATH = "manifest.json";
// ------------------------------------------------

const strip   = document.getElementById('strip');
const captionBar = document.getElementById('captionBar');
const dotsEl  = document.getElementById('dots');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const win     = document.getElementById('window');

let items = [];
let current = 0;

function rawUrl(f){ return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${IMAGES_PATH}/${f}`; }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init(){
  let data;
  try{
    const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${MANIFEST_PATH}`);
    if(!res.ok) throw new Error();
    data = await res.json();
  }catch{
    strip.innerHTML = '<div class="msg">Could not load gallery — check OWNER / REPO / BRANCH.</div>';
    prevBtn.classList.add('hidden'); nextBtn.classList.add('hidden');
    return;
  }
  items = data;
  if(!items.length){
    strip.innerHTML = '<div class="msg">No images yet.</div>';
    prevBtn.classList.add('hidden'); nextBtn.classList.add('hidden');
    return;
  }

  items.forEach((item, idx)=>{
    const slide = document.createElement('div');
    slide.className = 'slide';
    const img = document.createElement('img');
    img.src = rawUrl(item.filename);
    img.alt = item.description || '';
    img.loading = idx === 0 ? 'eager' : 'lazy';
    slide.appendChild(img);
    strip.appendChild(slide);

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.addEventListener('click', ()=> show(idx));
    dotsEl.appendChild(dot);
  });

  show(0);

  prevBtn.addEventListener('click', ()=> show(current - 1));
  nextBtn.addEventListener('click', ()=> show(current + 1));

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowLeft')  show(current - 1);
    if(e.key === 'ArrowRight') show(current + 1);
  });

  // touch / drag swipe
  let startX = null, startY = null, locked = null;
  win.addEventListener('touchstart', (e)=>{ startX = e.touches[0].clientX; startY = e.touches[0].clientY; locked = null; }, {passive:true});
  win.addEventListener('touchmove', (e)=>{
    if(!locked){
      const dx = Math.abs(e.touches[0].clientX - startX);
      const dy = Math.abs(e.touches[0].clientY - startY);
      locked = dx > dy ? 'x' : 'y';
    }
    if(locked === 'x') e.preventDefault();
  }, {passive:false});
  win.addEventListener('touchend', (e)=>{
    if(startX === null || locked !== 'x') return;
    const dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx) > 40) show(current + (dx < 0 ? 1 : -1));
    startX = null;
  });
}

function show(idx){
  current = Math.max(0, Math.min(idx, items.length - 1));
  strip.style.transform = `translateX(-${current * 100}%)`;

  prevBtn.classList.toggle('hidden', current === 0);
  nextBtn.classList.toggle('hidden', current === items.length - 1);

  [...dotsEl.children].forEach((d,i)=> d.classList.toggle('active', i === current));

  const item = items[current];
  captionBar.innerHTML = items.length > 1
    ? `<span class="counter">${current+1} / ${items.length}</span><span class="desc">${item.description ? escapeHtml(item.description) : ''}</span>`
    : `<span class="desc">${item.description ? escapeHtml(item.description) : ''}</span>`;
}

init();
</script>
</body>
</html>
