<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Ezra Gray</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <div id="feed"></div>

  <div id="empty-state" hidden>
    <p>Nothing here yet.</p>
    <p class="empty-sub">Add images to the <code>Image</code> folder and rebuild.</p>
  </div>

  <div id="corner">
    <a id="corner-name" href="index.html">Ezra Gray</a>
    <a id="corner-txt" href="text.html">🎨</a>
  </div>

  <script src="assets/script.js"></script>
  <script>
    const feed = document.getElementById("feed");

    // Trackpad / mouse wheel → horizontal scroll
    feed.addEventListener("wheel", e => {
      if (e.deltaY !== 0) { e.preventDefault(); feed.scrollLeft += e.deltaY; }
    }, { passive: false });

    // Click-drag
    let down = false, startX, startScroll;
    feed.addEventListener("mousedown", e => { down = true; startX = e.pageX; startScroll = feed.scrollLeft; });
    window.addEventListener("mouseup", () => down = false);
    window.addEventListener("mousemove", e => {
      if (!down) return;
      e.preventDefault();
      feed.scrollLeft = startScroll - (e.pageX - startX);
    });
  </script>
</body>
</html>
